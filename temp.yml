            interval: 5s
            start_period: 10s

    pymongo_api:
        container_name: pymongo_api
        build: 
            context: api_app
            dockerfile: Dockerfile
        image: kazhem/pymongo_api:1.0.0
        depends_on:
            -   redis
        ports:
          - 8080:8080
        environment:
            MONGODB_URL: "mongodb://mongos_router:27020"
            MONGODB_DATABASE_NAME: "somedb"
            REDIS_URL: "redis://redis:6379"

    redis:
        container_name: redis
        image: redis:latest
        ports:
          - "6379:6379"

volumes:
   mongod_config_server:
   mongos_router:
   mongod_rs0_0:
   mongod_rs0_1:
   mongod_rs0_2:
   mongod_rs1_0:
   mongod_rs1_1:
   mongod_rs1_2:
