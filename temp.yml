name: temp

services:

    mongod_config_server:
        image: dh-mirror.gitverse.ru/mongo:latest
        restart: always
        container_name: mongod_config_server
        volumes:
            - mongod_config_server:/data/db
        expose:
            - "27017"
        command: [
            "--configsvr",
            "--replSet",
            "mongod_config_server",
            "--bind_ip_all",
            "--port",
            "27017"
        ]
        healthcheck:
            test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--port", "27017" ]
            interval: 5s
            start_period: 10s

    mongos_router:
        image: dh-mirror.gitverse.ru/mongo:latest
        restart: always
        container_name: mongos_router
        volumes:
            - mongos_router:/data/db
        expose:
            - "27020"
        command: [
            "mongos",
            "--configdb", 
            "mongod_config_server/mongod_config_server:27017",
            "--bind_ip_all",
            "--port",
            "27020"
        ]
        healthcheck:
            test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--port", "27020" ]
            interval: 5s
            start_period: 10s

    mongod_rs0_0:
        image: dh-mirror.gitverse.ru/mongo:latest
        restart: always
        container_name: mongod_rs0_0
        volumes:
            - mongod_rs0_0:/data/db
        expose:
            - "27018"
        command: [
            "--shardsvr",
            "--replSet",
            "mongod_rs0",
            "--bind_ip_all",
            "--port",
            "27018"
        ]
        healthcheck:
